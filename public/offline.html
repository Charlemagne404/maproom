<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5eee5" />
    <title>Offline · maproom.</title>
    <script>
      (() => {
        let preference = 'light'
        try {
          const saved = localStorage.getItem('maproom-theme')
          if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved
        } catch {}
        const media = matchMedia('(prefers-color-scheme: dark)')
        const apply = () => {
          const dark = preference === 'dark' || (preference === 'system' && media.matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#292521' : '#f5eee5')
        }
        apply()
        if (preference === 'system') media.addEventListener('change', apply)
      })()
    </script>
    <style>
      :root { color-scheme: light; --paper: #f5eee5; --ink: #292622; --muted: #756b61; --accent: #e57937; }
      html[data-theme="dark"] { color-scheme: dark; --paper: #292521; --ink: #f2e7d9; --muted: #b8aa99; --accent: #f29a62; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(34rem, calc(100% - 2.5rem)); padding: 3rem 0; }
      .mark { color: var(--ink); font: 750 1.25rem/1 system-ui, sans-serif; letter-spacing: -.06em; }
      .mark span { color: var(--accent); }
      h1 { margin: .7rem 0; font: 700 clamp(2rem, 8vw, 3.4rem)/1.08 system-ui, sans-serif; letter-spacing: -.04em; }
      p { color: var(--muted); }
      a { display: inline-block; margin-top: 1rem; color: var(--ink); text-decoration-color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 4px; }
    </style>
  </head>
  <body><main><div class="mark">maproom<span>.</span></div><h1>This part of the atlas is not here yet.</h1><p>Reconnect and open this page once. The app shell and any geography you have already opened remain available offline.</p><a href="/">Return to maproom.</a></main></body>
</html>
