<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/maproom.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5eee5" />
    <meta name="description" content="A warm collection of daily geography puzzles. Find a country, trace a route, and play your way around the world." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>maproom. — geography, at play</title>
    <script>
      (() => {
        let preference = 'light'
        try {
          const saved = localStorage.getItem('maproom-theme')
          if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved
        } catch {}
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        const theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.themePreference = preference
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#292521' : '#f5eee5')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
